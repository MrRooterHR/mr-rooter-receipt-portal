<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PO Receipt Machine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #202124;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      color: #666;
    }

    .status {
      padding: 16px;
      border-radius: 10px;
      background: #f1f3f4;
      line-height: 1.5;
    }

    .success {
      background: #e6f4ea;
    }

    .error {
      background: #fce8e6;
    }

    .purchase {
      margin-top: 20px;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 3px;
    }

    .value {
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Submit Purchase Receipt</h1>

      <p class="subtitle">
        Mr. Rooter Plumbing — PO Receipt Machine
      </p>

      <div
        id="status"
        class="status"
      >
        Looking up purchase...
      </div>

      <div
        id="purchase"
        class="purchase"
        hidden
      >

        <div class="row">
          <span class="label">PO</span>
          <span id="poValue" class="value"></span>
        </div>

        <div class="row">
          <span class="label">Technician</span>
          <span id="technician" class="value"></span>
        </div>

        <div class="row">
          <span class="label">Vendor</span>
          <span id="vendor" class="value"></span>
        </div>

        <div class="row">
          <span class="label">Category</span>
          <span id="category" class="value"></span>
        </div>

        <div class="row">
          <span class="label">Job #</span>
          <span id="jobNumber" class="value"></span>
        </div>

        <div class="row">
          <span class="label">Customer / Job</span>
          <span id="customerJob" class="value"></span>
        </div>

      </div>

    </div>

  </div>


  <script>

    const BACKEND =
      "https://script.google.com/macros/s/AKfycbwPTH0fqVAeAUJWRpv70UhpagdYhx2ZKIXE_UbZXB2GVcmfjgkxUMNN7qjGUH328C0/exec";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const book =
      (params.get("book") || "").trim();


    const po =
      (params.get("po") || "")
        .trim()
        .toUpperCase();


    const status =
      document.getElementById("status");


    const purchase =
      document.getElementById("purchase");


    if (!book || !po) {

      showError(
        "Receipt link incomplete. Please use the receipt link provided with your approved PO."
      );

    }

    else {

      loadPurchase();

    }


    function loadPurchase() {

      /*
       * JSONP lets the public GitHub page read
       * the Apps Script response without depending
       * on cross-origin fetch permissions.
       */

      window.receiptLookup =
        function(result) {

          delete window.receiptLookup;

          if (
            !result ||
            !result.success
          ) {

            showError(
              result && result.message
                ? result.message
                : "The purchase could not be loaded."
            );

            return;
          }


          const info =
            result.purchase;


          document
            .getElementById("poValue")
            .textContent =
              info.po || "";


          document
            .getElementById("technician")
            .textContent =
              info.technician || "—";


          document
            .getElementById("vendor")
            .textContent =
              info.vendor || "—";


          document
            .getElementById("category")
            .textContent =
              info.category || "—";


          document
            .getElementById("jobNumber")
            .textContent =
              info.jobNumber || "—";


          document
            .getElementById("customerJob")
            .textContent =
              info.customerJob || "—";


          status.classList.add(
            "success"
          );


          status.textContent =
            info.hasReceipt
              ? "Purchase found. A receipt has already been submitted for this PO."
              : "Purchase found. Ready for receipt submission.";


          purchase.hidden =
            false;

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        BACKEND +
        "?action=lookup" +
        "&callback=receiptLookup" +
        "&book=" +
        encodeURIComponent(book) +
        "&po=" +
        encodeURIComponent(po);


      script.onerror =
        function() {

          showError(
            "The Receipt Machine could not be reached. Please try again."
          );

        };


      document.body.appendChild(
        script
      );

    }


    function showError(message) {

      status.classList.add(
        "error"
      );

      status.textContent =
        message;

    }

  </script>

</body>
</html>
